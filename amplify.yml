# AWS Amplify Hosting (Gen 2 fullstack). See docs/deployment/MODELEDMGMT_WWW_GO_LIVE_STEPS.md
version: 1
customRules:
  - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>'
    target: '/index.html'
    status: '200'
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - if [ ! -f amplify_outputs.json ]; then echo "ERROR Missing amplify_outputs.json — backend deploy step must succeed first"; exit 1; fi
        - npm run build
        - test -f dist/index.html || (echo "ERROR dist/index.html missing — check Vite build" && exit 1)
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
